[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aftermark"
version = "0.5.0"
description = "Save what works. Bring your sources and intent into your coding agent's next task."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn>=0.40,<1",
  "mcp>=2.2,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.14,<5",
  "pypdf>=6.0,<7",
  "python-multipart>=0.0.22,<1",
]

[project.urls]
Repository = "https://github.com/FleetSnowFIuff/Aftermark"
Issues = "https://github.com/FleetSnowFIuff/Aftermark/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
aftermark = "aftermark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aftermark = ["static/*", "data/*.json", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
